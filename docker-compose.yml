services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: federation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./server
    env_file:
      - ./server/.env
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/federation
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
    volumes:
      - uploads:/app/data/uploads

  web:
    build: .
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
